name: fno-waves
channels:
  - pytorch::pytorch
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch
  - pytorch::pytorch-cuda=11.8
  - pytorch::pytorch-lightning
  - cuda-version=11.8
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyterlab
  - ipython
  - xarray
  - netCDF4
  - rasterio
  - pyproj
  - cartopy
  - gdal
  - pip
  - pip:
    - pyyaml
    - tensorboard
    - wandb
    - pytest
    - tqdm
    - copernicusmarine>=0.8.0
    - erddapy
    - requests
    - h5py
    - scikit-learn
    - scikit-optimize
    - einops
    - jax>=0.3.0
    - jaxlib>=0.3.0
    - attrs
    - xgcm
    - bottleneck
    - dask
